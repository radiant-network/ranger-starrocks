# Pull-request gate: lint + unit-test the Helm chart and prove the image still builds.
# Nothing is published here.
name: ci

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RANGER_VERSION: "2.8.0"

jobs:
  helm:
    name: helm lint + unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.0

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.0 --verify=false

      - name: helm lint
        run: helm lint helm/

      - name: helm unittest
        run: helm unittest helm/

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            RANGER_VERSION=${{ env.RANGER_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
