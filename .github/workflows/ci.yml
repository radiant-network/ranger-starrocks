# Pull-request gate: lint + unit-test the Helm chart and prove the image still builds.
# Nothing is published here.
name: ci

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RANGER_VERSION: "2.8.0"

jobs:
  helm:
    name: helm lint + unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.0

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.0 --verify=false

      - name: helm lint
        run: helm lint helm/

      - name: helm unittest
        run: helm unittest helm/

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # QEMU lets this amd64 runner build (and thus validate) the arm64 layers via emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Build both platforms to prove they still build; with push:false and no load: the
      # multi-arch result stays in the build cache (it can't be loaded into the docker daemon).
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            RANGER_VERSION=${{ env.RANGER_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
