# Publish the image and Helm chart to GHCR.
#
#   merge -> main : version = ${RANGER_VERSION}-<short-sha>-<unix-epoch>   (traceable dev build)
#   tag   v*      : version = ${RANGER_VERSION}-<tag>     e.g. 2.8.0-v0.1.0  (release)
#
# RANGER_VERSION is declared once below and is the single source for the base image build arg and
# the published version prefix. The same computed string tags the image and versions the chart.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

# Built-in GITHUB_TOKEN needs package write to push to GHCR (image + OCI chart).
permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RANGER_VERSION: "2.8.0"
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  publish:
    name: build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- gate: lint + unit-test before anything is published (covers direct pushes to main) ---
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.0

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.0 --verify=false

      - name: helm lint
        run: helm lint helm/

      - name: helm unittest
        run: helm unittest helm/

      # --- compute version / image tags ---
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.RANGER_VERSION }}-{{sha}}-{{date 'X'}},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.RANGER_VERSION }}-${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # --- build + push image ---
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            RANGER_VERSION=${{ env.RANGER_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- package + push chart with the same version (appVersion = RANGER_VERSION) ---
      - name: Package and push Helm chart
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          helm package helm/ --version "$VERSION" --app-version "$RANGER_VERSION" -d dist/
          helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"${{ secrets.GITHUB_TOKEN }}"
          helm push "dist/ranger-${VERSION}.tgz" "$CHART_REPO"
