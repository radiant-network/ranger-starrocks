{{- if .Values.serve.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ranger.fullname" . }}
  labels:
    {{- include "ranger.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
spec:
  type: {{ .Values.serve.service.type }}
  selector:
    {{- include "ranger.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.serve.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
