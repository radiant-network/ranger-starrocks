suite: phase toggles, isolation, and optional blocks
release:
  name: ranger
templates:
  - migrate-job.yaml
  - deployment.yaml
  - service.yaml
  - register-job.yaml
  - ingress.yaml
set:
  image.repository: ranger-dual-mode
  db.host: postgres:5432
  ranger.externalUrl: "https://ranger.internal.example.com"
  db.password:
    secret: { name: ranger, key: db-password }
  accounts.admin:
    secret: { name: ranger, key: admin-password }
  accounts.keyadmin:
    secret: { name: ranger, key: keyadmin-password }
  starrocks.username:
    value: root
  starrocks.password:
    secret: { name: ranger-sr, key: password }

tests:
  # ----------------------------------------------------------------------------------
  # Phase toggles
  # ----------------------------------------------------------------------------------
  - it: renders all three phases by default
    template: migrate-job.yaml
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Job }
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade

  - it: skips the migrate Job when migrate.enabled is false
    template: migrate-job.yaml
    set:
      migrate.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: skips the register Job when register.enabled is false
    template: register-job.yaml
    set:
      register.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: skips the Deployment when serve.enabled is false
    template: deployment.yaml
    set:
      serve.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: skips the Service when serve.enabled is false
    template: service.yaml
    set:
      serve.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  # ----------------------------------------------------------------------------------
  # Phase command + hook wiring
  # ----------------------------------------------------------------------------------
  - it: migrate runs the migrate command
    template: migrate-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["migrate"]

  - it: serve runs the serve command and is not a hook
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["serve"]
      - isNull:
          path: metadata.annotations

  - it: register runs the register command as a post hook with OnFailure restart
    template: register-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["register"]
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - equal:
          path: spec.template.spec.restartPolicy
          value: OnFailure

  # ----------------------------------------------------------------------------------
  # Credential routing: the chart injects each credential into ONLY the phases that
  # need it. Secrets render as valueFrom refs (the chart manages no Secrets).
  # ----------------------------------------------------------------------------------
  - it: serve carries the DB password but no account or StarRocks credentials
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_DB_PASSWORD")].valueFrom.secretKeyRef.name
          value: ranger
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: RANGER_ADMIN_PASSWORD }
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: RANGER_KEYADMIN_PASSWORD }
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: RANGER_STARROCKS_PASSWORD }
          any: true
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_REGISTER_ON_SERVE")].value
          value: "false"

  - it: migrate carries DB + account passwords but no StarRocks vars
    template: migrate-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_DB_PASSWORD")].valueFrom.secretKeyRef.key
          value: db-password
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_ADMIN_PASSWORD")].valueFrom.secretKeyRef.key
          value: admin-password
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_KEYADMIN_PASSWORD")].valueFrom.secretKeyRef.key
          value: keyadmin-password
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: RANGER_STARROCKS_JDBC_URL }
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: RANGER_STARROCKS_PASSWORD }
          any: true

  - it: register carries admin + StarRocks creds but never DB vars
    template: register-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_ADMIN_PASSWORD")].valueFrom.secretKeyRef.key
          value: admin-password
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_STARROCKS_USERNAME")].value
          value: root
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_STARROCKS_PASSWORD")].valueFrom.secretKeyRef.name
          value: ranger-sr
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: RANGER_DB_HOST }
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: RANGER_DB_PASSWORD }
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: RANGER_KEYADMIN_PASSWORD }
          any: true

  - it: translates the autocomplete boolean to yes/no for the register phase
    template: register-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_STARROCKS_AUTOCOMPLETE")].value
          value: "yes"

  - it: autocomplete false renders RANGER_STARROCKS_AUTOCOMPLETE=no
    template: register-job.yaml
    set:
      starrocks.autocomplete: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_STARROCKS_AUTOCOMPLETE")].value
          value: "no"

  - it: connection fields render as literal values by default
    template: migrate-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_DB_HOST")].value
          value: postgres:5432
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_DB_USER")].value
          value: rangeradmin

  - it: connection fields can be sourced from a Secret (explicit per-field)
    template: deployment.yaml
    set:
      db.host:
        secret: { name: ranger-conn, key: db-host }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_DB_HOST")].valueFrom.secretKeyRef.name
          value: ranger-conn
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_DB_HOST")].value

  - it: starrocks jdbcUrl and serviceName render as literals by default
    template: register-job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_STARROCKS_SERVICE_NAME")].value
          value: starrocks

  - it: starrocks jdbcUrl can be sourced from a Secret via starrocks.secret group
    template: register-job.yaml
    set:
      starrocks.jdbcUrl: ""
      starrocks.secret: ranger-sr
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_STARROCKS_JDBC_URL")].valueFrom.secretKeyRef.name
          value: ranger-sr
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_STARROCKS_JDBC_URL")].valueFrom.secretKeyRef.key
          value: RANGER_STARROCKS_JDBC_URL

  - it: an empty connection field is pulled from the group secret with the env-var-name key
    template: migrate-job.yaml
    set:
      db.host: ""
      db.secret: ranger-db
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_DB_HOST")].valueFrom.secretKeyRef.name
          value: ranger-db
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_DB_HOST")].valueFrom.secretKeyRef.key
          value: RANGER_DB_HOST

  - it: a group secret fills empty credentials using the env-var name as the default key
    template: migrate-job.yaml
    set:
      accounts.secret: ranger-acct
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_TAGSYNC_PASSWORD")].valueFrom.secretKeyRef.name
          value: ranger-acct
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_TAGSYNC_PASSWORD")].valueFrom.secretKeyRef.key
          value: RANGER_TAGSYNC_PASSWORD

  - it: an explicit per-field source overrides the group secret
    template: migrate-job.yaml
    set:
      accounts.secret: ranger-acct
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_ADMIN_PASSWORD")].valueFrom.secretKeyRef.name
          value: ranger
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_ADMIN_PASSWORD")].valueFrom.secretKeyRef.key
          value: admin-password

  - it: a group secret does not auto-render the optional db.rootPassword
    template: migrate-job.yaml
    set:
      db.secret: ranger-db
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: RANGER_DB_ROOT_PASSWORD }
          any: true

  - it: renders a configMapKeyRef when a credential is sourced from a ConfigMap
    template: migrate-job.yaml
    set:
      db.rootPassword:
        configMap: { name: ranger-config, key: db-root-password }
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RANGER_DB_ROOT_PASSWORD")].valueFrom.configMapKeyRef.name
          value: ranger-config

  - it: omits an env var whose credential source is empty (db.rootPassword unset)
    template: migrate-job.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: RANGER_DB_ROOT_PASSWORD }
          any: true

  # ----------------------------------------------------------------------------------
  # Optional blocks: absent by default, wired when set
  # ----------------------------------------------------------------------------------
  - it: serve has no initContainers, extra volumes, or envFrom by default
    template: deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.initContainers
      - isNull:
          path: spec.template.spec.volumes
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts
      - isNull:
          path: spec.template.spec.containers[0].envFrom

  - it: wires initContainers, extra volumes, mounts, env, and envFrom into serve
    template: deployment.yaml
    set:
      serve.initContainers:
        - name: copy-ssl-cert
          image: busybox:1.36
      serve.extraVolumes:
        - name: ssl-cert
          emptyDir: {}
      serve.extraVolumeMounts:
        - name: ssl-cert
          mountPath: /ssl
      serve.extraEnv:
        - name: DB_SSL_CA
          value: /ssl/ca.crt
      serve.extraEnvFrom:
        - secretRef:
            name: ranger-db-secret
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: copy-ssl-cert
      - contains:
          path: spec.template.spec.volumes
          content: { name: ssl-cert, emptyDir: {} }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: ssl-cert, mountPath: /ssl }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: DB_SSL_CA, value: /ssl/ca.crt }
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content: { secretRef: { name: ranger-db-secret } }

  - it: supports multiple envFrom sources on the migrate Job
    template: migrate-job.yaml
    set:
      migrate.extraEnvFrom:
        - secretRef:
            name: ranger-credentials
        - configMapRef:
            name: ranger-config
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].envFrom
          count: 2
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content: { secretRef: { name: ranger-credentials } }
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content: { configMapRef: { name: ranger-config } }

  # ----------------------------------------------------------------------------------
  # Ingress
  # ----------------------------------------------------------------------------------
  - it: renders no Ingress by default
    template: ingress.yaml
    asserts:
      - hasDocuments: { count: 0 }

  - it: renders no Ingress when serve is disabled even if ingress is enabled
    template: ingress.yaml
    set:
      serve.enabled: false
      serve.ingress.enabled: true
    asserts:
      - hasDocuments: { count: 0 }

  - it: derives the ingress host from externalUrl when no explicit hosts are set
    template: ingress.yaml
    set:
      serve.ingress.enabled: true
    asserts:
      - isKind: { of: Ingress }
      - equal:
          path: spec.rules[0].host
          value: ranger.internal.example.com

  - it: explicit serve.ingress.hosts overrides the derived host
    template: ingress.yaml
    set:
      serve.ingress.enabled: true
      serve.ingress.hosts:
        - name: ranger.override.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: ranger.override.com
      - lengthEqual: { path: spec.rules, count: 1 }

  - it: renders an Ingress routing to the serve Service with overrides honored
    template: ingress.yaml
    set:
      serve.ingress.enabled: true
      serve.ingress.ingressClassName: alb
      serve.ingress.path: /
      serve.ingress.pathType: Prefix
      serve.ingress.annotations:
        alb.ingress.kubernetes.io/target-type: ip
      serve.ingress.hosts:
        - name: ranger.example.com
    asserts:
      - isKind: { of: Ingress }
      - equal: { path: spec.ingressClassName, value: alb }
      - equal:
          path: metadata.annotations["alb.ingress.kubernetes.io/target-type"]
          value: ip
      - equal:
          path: spec.rules[0].host
          value: ranger.example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: ranger
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 6080
      - isNull: { path: spec.tls }

  - it: emits a tls block only for hosts that enable it
    template: ingress.yaml
    set:
      serve.ingress.enabled: true
      serve.ingress.hosts:
        - name: ranger.example.com
          tls:
            enabled: true
            secretName: ranger-tls
        - name: internal.example.com
    asserts:
      - lengthEqual: { path: spec.tls, count: 1 }
      - equal:
          path: spec.tls[0].hosts[0]
          value: ranger.example.com
      - equal:
          path: spec.tls[0].secretName
          value: ranger-tls
      - lengthEqual: { path: spec.rules, count: 2 }
