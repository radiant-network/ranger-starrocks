# Chart is published as `apache-ranger-starrocks` (matching the image), but resources keep the
# short `ranger` name so the default http://ranger:6080 service URLs below still resolve.
nameOverride: ranger

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

# ----------------------------------------------------------------------------------------------
# Connection fields & credentials
#
# The chart manages no Secrets — you pre-create them. The chart routes each value to ONLY the
# phases that need it (migrate / serve / register), so you never wire phases yourself.
#
# Every field under db / accounts / starrocks is "literal-or-sourced" — set it one of these ways
# (mixable across fields):
#
#   { secret:    { name?: <secret>, key?: <key> } }    # -> valueFrom.secretKeyRef
#   { configMap: { name: <cm>,      key: <key> } }     # -> valueFrom.configMapKeyRef
#   { value: "<literal>" }                             # -> plain value (explicit map form)
#   <bare-scalar>                                      # -> plain value
#   "" (empty)                                         # pulled from the group secret (below), else nothing
#
# Group default: set `<group>.secret: <name>` once and any EMPTY field in that group is read from
# that Secret using a default key equal to the ENV VAR NAME (RANGER_DB_PASSWORD, RANGER_DB_HOST, ...).
# In a per-field `secret:`, an omitted name/key falls back to the group secret / that default key.
# Because keys default to env-var names, the same Secret also works as a raw extraEnvFrom import.
# (db.rootPassword has no default key, so the group secret never auto-pulls it.)
# ----------------------------------------------------------------------------------------------
db:
  host: ""
  name: ranger
  user: rangeradmin
  rootUser: rangeradmin          # unused under SeparateDBA; routed to migrate only
  secret: ""                     # default Secret name for the db.* credentials below
  password: ""                   # RANGER_DB_PASSWORD       -> migrate + serve
  rootPassword: ""               # RANGER_DB_ROOT_PASSWORD  -> migrate (optional; no group default)

# One credential source per Ranger account password.
accounts:
  secret: ""                     # default Secret name for the accounts.* credentials below
  admin: ""                      # RANGER_ADMIN_PASSWORD    -> migrate + register
  keyadmin: ""                   # RANGER_KEYADMIN_PASSWORD -> migrate
  tagsync: ""                    # RANGER_TAGSYNC_PASSWORD  -> migrate
  usersync: ""                   # RANGER_USERSYNC_PASSWORD -> migrate

ranger:
  # External URL of the admin UI — used for RANGER_POLICYMGR_EXTERNAL_URL and as the default
  # ingress host (scheme + port stripped). Override serve.ingress.hosts to use a different host.
  externalUrl: ""

starrocks:
  # true  -> RANGER_STARROCKS_AUTOCOMPLETE=yes: enables the StarRocks plugin class (UI Test
  #          Connection / resource autocomplete) and REQUIRES the username/password below.
  # false -> base class, no probing; username/password are optional.
  autocomplete: true             # boolean: true=yes (requires username+password), false=no
  serviceName: "starrocks"       # RANGER_STARROCKS_SERVICE_NAME -> register (literal or sourced)
  jdbcUrl: ""                    # RANGER_STARROCKS_JDBC_URL     -> register (literal or sourced)
  secret: ""                     # default Secret name for all starrocks.* fields below
  # Required only when register is enabled AND autocomplete is true.
  username: ""                   # RANGER_STARROCKS_USERNAME -> register
  password: ""                   # RANGER_STARROCKS_PASSWORD -> register

migrate:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  # Individual env vars (raw EnvVar objects: name/value or name/valueFrom).
  extraEnv: []
  # Bulk-load Secrets or ConfigMaps into the migrate Job.
  # Example:
  #   extraEnvFrom:
  #     - secretRef:
  #         name: ranger-credentials
  extraEnvFrom: []

serve:
  enabled: true
  replicas: 1

  # Init containers run before the ranger container starts in the serve Deployment.
  # Use to prepare shared volumes — e.g. copying SSL certificates for StarRocks TLS.
  #
  # Example — copy a CA cert from a Secret into a shared emptyDir:
  #
  #   initContainers:
  #     - name: copy-ssl-cert
  #       image: busybox:1.36
  #       command: ["sh", "-c", "cp /certs-src/ca.crt /ssl/ca.crt && chmod 444 /ssl/ca.crt"]
  #       volumeMounts:
  #         - name: ssl-cert-src
  #           mountPath: /certs-src
  #           readOnly: true
  #         - name: ssl-cert
  #           mountPath: /ssl
  #
  #   extraVolumes:
  #     - name: ssl-cert-src
  #       secret:
  #         secretName: starrocks-tls-ca
  #     - name: ssl-cert
  #       emptyDir: {}
  #
  #   extraVolumeMounts:
  #     - name: ssl-cert
  #       mountPath: /ssl
  #       readOnly: true
  #
  #   extraEnv:
  #     - name: DB_SSL_CA
  #       value: /ssl/ca.crt
  initContainers: []

  # Additional volumes attached to the serve Deployment pod (paired with initContainers above).
  extraVolumes: []

  # Additional volume mounts for the ranger container in the serve Deployment.
  extraVolumeMounts: []

  # Individual env vars for the serve Deployment.
  # Use for feature flags or paths set by init containers (e.g. DB_SSL_CA).
  extraEnv: []
  # Bulk-load Secrets or ConfigMaps into the serve Deployment.
  # Example:
  #   extraEnvFrom:
  #     - secretRef:
  #         name: ranger-db-secret
  #     - secretRef:
  #         name: ranger-tls-secret
  #     - configMapRef:
  #         name: ranger-audit-config
  extraEnvFrom: []

  resources: {}

  service:
    type: ClusterIP
    port: 6080

  # Ingress for the serve admin UI/REST (port 6080). Modeled after the Airflow chart's
  # ingress block — override ingressClassName, path/pathType, hosts, annotations, and TLS.
  ingress:
    enabled: false
    ingressClassName: ""
    # Default path "/" with pathType Prefix. Note (as on the AWS ALB controller):
    # Prefix "/" is expanded to the path-pattern "/*", so static assets route through;
    # ImplementationSpecific "/" may match only "/" exactly and 404 the UI bundle.
    path: /
    pathType: Prefix
    annotations: {}
    #   alb.ingress.kubernetes.io/target-type: ip
    #   alb.ingress.kubernetes.io/healthcheck-path: /login.jsp
    # hosts is a list of { name, tls: { enabled, secretName } }.
    hosts: []
    #   - name: ranger.dev.example.com
    #     tls:
    #       enabled: true
    #       secretName: ranger-tls

register:
  enabled: true
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  adminUrl: "http://ranger:6080"
  adminUser: admin
  # Individual env vars for the register Job.
  extraEnv: []
  # Bulk-load Secrets or ConfigMaps into the register Job.
  # Example:
  #   extraEnvFrom:
  #     - secretRef:
  #         name: ranger-admin-secret
  #     - secretRef:
  #         name: ranger-starrocks-secret
  extraEnvFrom: []
